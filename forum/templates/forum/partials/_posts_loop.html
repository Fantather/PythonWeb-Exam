{% comment %} {% for post in page_obj %}
    {% if forloop.last and page_obj.has_next %}
        <div hx-get="?page={{ page_obj.next_page_number }}"
             hx-trigger="revealed"
             hx-swap="afterend">
            {% include 'forum/templates/forum/partials/_card_post.html' with post=post %}
        </div>
    {% else %}
        <div>
            {% include 'forum/templates/forum/partials/_card_post.html' with post=post %}
        </div>
    {% endif %}
{% endfor %} {% endcomment %}
