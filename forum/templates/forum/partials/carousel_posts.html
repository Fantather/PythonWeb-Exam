<div class="carousel carousel-slider center" style="height: 350px;">
  {% for img_obj in post.images.all %}
      <div class="carousel-item" style="background-color: #f5f5f5; border-radius: 4px;">
          <img src="{{ img_obj.image.url }}"
               alt="Вложение"
               class="responsive-img"
               style="object-fit: contain; width: 100%; height: 100%;">
      </div>
  {% endfor %}
</div>
