<ul class="collapsible z-depth-0">
    <li>
        <div class="collapsible-header">
            <button class="btn-flat">Ответить</button>
        </div>
        
        <div class="collapsible-body">
            <form method="post" action="{% url 'add_reply' topic.pk %}">
                {% csrf_token %}
                
                <input type="hidden" name="parent_id" value="{{ post.pk }}">
                
                <div class="input-field">
                    <textarea name="comment" class="materialize-textarea" required></textarea>
                    <label>Ваш текст</label>
                </div>
                <button type="submit" class="btn">Отправить</button>
            </form>
        </div>
    </li>
</ul>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var elems = document.querySelectorAll('.collapsible');
        M.Collapsible.init(elems, {
            accordion: true
        });
    });
</script>
