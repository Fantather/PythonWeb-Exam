{% load static %}
{% for category in categories %}
    <div class="col s12 m8 offset-m2">
        <div class="card horizontal category-card">
            
            {% if category.icon %}
                <div class="card-image">
                    <img src="{{ category.icon.url }}" alt="{{ category.title }}" onerror="this.onerror=null;this.src='{% static 'image.png' %}';">
                </div>
            {% endif %}
            
            <div class="card-stacked">
                <div class="card-content">
                    <span class="card-title black-text">{{ category.title }}</span>
                    
                    <p class="grey-text category-description">{{ category.description }}</p>
                </div>
                <div class="card-action">
                    <a href="{{ category.get_absolute_url }}" class="blue-text text-darken-2">Перейти к обсуждениям</a>
                </div>
            </div>
            
        </div>
    </div>
{% empty %}
    <div class="col s12 m8 offset-m2">
        <div class="card-panel center-align grey lighten-4">
            <p class="grey-text">Пока нет категорий для обсуждения</p>
        </div>
    </div>
{% endfor %}
