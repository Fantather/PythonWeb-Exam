{% load static %}

<div class="col s12">
    <h5 class="white-text text-darken-2 forum-category-heading">Сообщества</h5>
    
    {% if categories %}
        <div class="carousel" id="forum-carousel">
            {% for category in categories %}
                <div class="carousel-item card hoverable">

                       {% if category.icon %}
                                <img src="{{ category.icon.url }}" alt="{{ category.title }}" onerror="this.onerror=null; this.src='{% static 'image.png' %}'; this.style.objectFit='contain';">
                            {% else %}
                                <div class="category-bg-placeholder">
                                    <i class="material-icons large">folder</i>                        
                        </div>
                        {% endif %}
                        <div class = "category-card-content">
                            <span class="card-title">
                            {{ category.title }}
                            </span>
                            <p class="category-desc">
                            {{ category.description|truncatechars:60 }}
                            </p>
                        </div>

                </div>
            {% endfor %}
        </div>
    {% else %}
        <p class="center-align grey-text" style="margin-top: 2rem;">Сообщества отсутствуют</p>
    {% endif %}
</div>
